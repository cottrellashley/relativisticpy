[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "relativisticpy"
version = "2.0.0"
description = "General Relativity for physicists in a hurry: write tensor equations the way they look on paper, or paste the LaTeX, and compute them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashley Cottrell" }]
keywords = [
    "general relativity",
    "tensors",
    "einstein summation",
    "differential geometry",
    "latex",
    "symbolic computation",
    "physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["sympy>=1.14"]

[project.optional-dependencies]
numeric = ["numpy>=1.24", "scipy>=1.10"]
data = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]
jax = ["numpy>=1.24", "scipy>=1.10", "jax>=0.4.30"]

[project.urls]
Homepage = "https://relativisticpy.org"
Source = "https://github.com/cottrellashley/relativisticpy"
Issues = "https://github.com/cottrellashley/relativisticpy/issues"
Changelog = "https://github.com/cottrellashley/relativisticpy/blob/main/CHANGELOG.md"

[project.scripts]
relativisticpy = "relativisticpy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "jax>=0.4.30",
]
docs = ["mkdocs-material>=9.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/relativisticpy"]

[tool.hatch.build.targets.sdist]
include = ["src/relativisticpy", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src", "README.md", "docs"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--doctest-modules",
    "--doctest-glob=*.md",
]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["slow: long-running symbolic computations (deselect with -m 'not slow')"]

[tool.coverage.run]
branch = true
source = ["relativisticpy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF001", # Greek letters and maths symbols are deliberate in this codebase
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sympy.*", "scipy.*", "pandas", "pandas.*", "sklearn.*", "jax", "jax.*"]
ignore_missing_imports = true
