site_name: RelativisticPy
site_description: >-
  RelativisticPy reads mathematics as it is written, in LaTeX, plain text or Unicode, and
  computes it: General Relativity with SymPy, numerical data in index notation over any
  space, and the equations of LaTeX papers, which it checks.
site_url: https://relativisticpy.org
repo_url: https://github.com/cottrellashley/relativisticpy
repo_name: cottrellashley/relativisticpy
edit_uri: edit/main/docs/

# llms.txt groups the pages by these sections; tools/navigation.py writes it.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - The language: language.md
      - LaTeX: latex.md
      - Tensors and geometry: tensors.md
      - Solving tensor equations: notation.md
      - Checking papers: checking.md
      - Beyond spacetime: spaces.md
      - Numerics: numerics.md
  - Reference:
      - The language reference: reference.md
      - Python API: python.md
      - Command line: cli.md
      - Glossary: glossary.md
  - Troubleshooting: troubleshooting.md
  - Coming from:
      - Other tools: coming-from.md
      - RelativisticPy 1.x: upgrading.md
  - Jupyter and notebooks: jupyter.md
  - Examples: examples.md
  - How it works: architecture.md
  - Roadmap: roadmap.md

# Every page is in the navigation, and every link, to a page or to a heading, is found.
validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences

hooks:
  - tools/code_copy.py
  - tools/navigation.py

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
