name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The same answer every run: the tests run under one hash seed, as the command line does
# (design/interface.md), so that no gate depends on the seed a run happens to draw.
env:
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run --group docs pytest tests/test_site.py

  notebooks:
    name: Notebooks, and the editor in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Node's Playwright, with Chromium
        run: |
          npm install --global playwright@1
          npx playwright install --with-deps chromium
      - run: uv run --group notebooks pytest tests/live tests/test_notebooks.py
        env:
          RELATIVISTICPY_BROWSER_TESTS: required

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group docs mkdocs build --strict

  seeds:
    name: The curriculum under hash seeds 0, 1 and 2
    runs-on: ubuntu-latest
    # Findings, not a gate: each case whose outcome depends on the seed is a warning on
    # the case, and the build goes on whatever they are.
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python benchmarks/curriculum.py --seeds 0,1,2
